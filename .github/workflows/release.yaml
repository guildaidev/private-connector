name: Private connector release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the connector package and chart (major.minor.patch)
        required: true
        type: string
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: private-connector-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - run: python -m pip install --upgrade 'pip>=26.2.2' && pip install uv==0.13.4
      - name: Require released source and matching versions
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version="${REQUESTED_VERSION#v}"
          revision="$(git rev-parse HEAD)"
          CONNECTOR_VERSION="$version" uv run --locked python scripts/check-release.py
          if git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
            test "$(git rev-parse "v$version^{commit}")" = "$revision"
          fi
          echo "CONNECTOR_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_REVISION=$revision" >> "$GITHUB_ENV"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Validate tests and chart
        run: |
          uv run --frozen ruff check
          uv run --frozen ruff format --check
          uv run --frozen python -m unittest discover -s tests -v
          uv run --frozen python -m unittest discover -s packaging_tests -v
      - name: Validate Compose configuration
        working-directory: deploy/compose
        env:
          CONNECTOR_IMAGE: private-connector:release-test
        run: docker compose config --quiet
      - name: Test the packaged runtime before publishing
        run: |
          docker build --build-arg VERSION="$CONNECTOR_VERSION" --build-arg REVISION="$RELEASE_REVISION" -t private-connector:release-test .
          bash scripts/smoke-image.sh private-connector:release-test
          docker run --rm private-connector:release-test --version
      - name: Set package names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/private-connector" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/${OWNER,,}/charts" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require an unpublished image and chart version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.names.outputs.image }}
          CHARTS: ${{ steps.names.outputs.charts }}
        run: uv run --frozen python scripts/check_release_available.py
      - name: Publish versioned multi-architecture image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ steps.version.outputs.revision }}
          provenance: mode=max
          sbom: true
      - name: Build customer downloads and publish the pinned chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          CHARTS: ${{ steps.names.outputs.charts }}
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          uv run --frozen python scripts/release_assets.py --image "$IMAGE" --digest "$DIGEST" --revision "$RELEASE_REVISION" --output dist
          helm lint "dist/private-connector-${CONNECTOR_VERSION}.tgz" --values dist/connector-values.yaml --set connector.id=00000000-0000-0000-0000-000000000001 --set connector.controlPlaneUrl=https://core.example.test
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push "dist/private-connector-${CONNECTOR_VERSION}.tgz" "$CHARTS"
          printf 'Image: `%s@%s`\n\nChart: `%s/private-connector` version `%s`\n' "$IMAGE" "$DIGEST" "$CHARTS" "$CONNECTOR_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: private-connector-release
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CONNECTOR_VERSION: ${{ needs.publish.outputs.version }}
      RELEASE_REVISION: ${{ needs.publish.outputs.revision }}
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: private-connector-release
          path: dist
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - name: Verify public downloads without registry credentials
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker pull --platform linux/arm64 "$IMAGE@$DIGEST"
          helm show chart "oci://${IMAGE%/*}/charts/private-connector" --version "$CONNECTOR_VERSION"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Create the GitHub release
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f ! -name release-notes.md | sort)
          gh release create "v$CONNECTOR_VERSION" "${assets[@]}" --target "$RELEASE_REVISION" --title "Private connector $CONNECTOR_VERSION" --notes-file dist/release-notes.md --draft
          gh release edit "v$CONNECTOR_VERSION" --draft=false --latest
