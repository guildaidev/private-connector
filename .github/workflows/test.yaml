name: Private connector

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install --upgrade 'pip>=26.2.2' && pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen --python "${{ matrix.python }}"
      - name: Test forwarding and authenticated TLS WebSocket lifecycle
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Lint and formatting
        run: |
          uv run --frozen ruff check
          uv run --frozen ruff format --check

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - run: python -m pip install --upgrade 'pip>=26.2.2' && pip install uv==0.13.4
      - name: Validate private connector chart and dependency lock
        run: |
          uv sync --locked
          uv run --frozen python -m unittest discover -s packaging_tests -v
      - name: Validate Compose configuration
        working-directory: deploy/compose
        env:
          CONNECTOR_IMAGE: private-connector:ci
        run: |
          docker compose config --quiet
      - name: Build and exercise private connector image
        run: |
          docker build -t private-connector:ci .
          bash scripts/smoke-image.sh private-connector:ci
