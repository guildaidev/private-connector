[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guild-private-connector"
version = "0.2.0"
description = "Private connector for Guild's persistent WebSocket tunnel"
requires-python = ">=3.11"
dependencies = ["websockets>=16,<17", "httpx>=0.28,<1"]

[project.scripts]
guild-private-connector = "guild_connector.__main__:main"
guild-private-connector-health = "guild_connector.health:main"
guild-customer-connector = "guild_connector.__main__:main"
guild-customer-connector-health = "guild_connector.health:main"

[tool.setuptools.packages.find]
include = ["guild_connector*"]

[dependency-groups]
dev = ["ruff==0.16.8", "pyyaml==6.0.3"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
